<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AstroSpark WebOS</title>
  <!-- FIXED: Links directly to your root style.css file (Option 1) -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- TOP BAR NAVIGATION -->
  <div class="top-bar">
    <p id="osTrigger" class="top-bar-title" title="Click to open Welcome window">AstroSparkOS</p>
    <p class="top-bar-badge">A Spark in Space</p>
    <p id="timeElement" class="top-bar-time"></p>
  </div>

  <!-- DRAGGABLE GLASS WINDOW BOX -->
  <div id="welcome" class="window-box">
    
    <!-- WINDOW HEADER AREA (DRAG HANDLE ROW) -->
    <div id="welcomeheader" class="closebutton">
      <!-- RED SQUARE CLOSE BUTTON WITH CENTERED X -->
      <div id="welcomeclose" title="Close">✕</div>
      
      <!-- WINDOW TITLE TEXT -->
      <p class="window-header-title">AstroSpark</p>
      
      <!-- INVISIBLE RIGHT BALANCE BLOCK -->
      <div class="header-spacer"></div>
    </div>
    
    <!-- WINDOW INTERIOR MAIN CONTENT -->
    <h1>Welcome to AstroSpark WebOS!</h1>
    <h2>Introduction</h2>
    <p>Hello World</p>
    <img src="./BlackHole.jpeg" alt="Black Hole" />
  </div>
    <!-- LIQUID TASKBAR DOCK -->
  <div class="dock-container">
    <!-- Welcome App Launcher -->
    <div id="dockWelcome" class="dock-icon active-app" title="Welcome App">✨</div>
    <!-- Future App Placeholder Slot -->
    <div id="dockCustomApp" class="dock-icon" title="Awaiting Configuration...">🚀</div>
  </div>


  <!-- RUNTIME DESKTOP OS INTERACTION CONTROLS -->
  <script>
    // Live OS Clock Functionality
    function updateTime() {
        var currentTime = new Date().toLocaleString();
        var timeText = document.querySelector("#timeElement");
        if(timeText) timeText.innerHTML = currentTime;
    }
    setInterval(updateTime, 1000);
    updateTime(); 

    // Window Visibility Core Elements
    const welcomeWindow = document.getElementById("welcome");
    const closeButton = document.getElementById("welcomeclose");
    const osTrigger = document.getElementById("osTrigger");

    // Action: Click Red Square X to close/hide window box
    closeButton.addEventListener("click", function(e) {
      e.stopPropagation(); // Safe protection barrier for drag tracking loops
      welcomeWindow.style.display = "none";
    });

    // Action: Click AstroSparkOS text banner to pop window back open
    osTrigger.addEventListener("click", function() {
      // Flushes out position modifications and resets window coordinates dead center
      welcomeWindow.style.top = "50%";
      welcomeWindow.style.left = "50%";
      welcomeWindow.style.transform = "translate(-50%, -50%)";
      welcomeWindow.style.display = "block";
    });
        // Target the dock shortcut element
    const dockWelcome = document.getElementById("dockWelcome");

    // Action: Click the dock app symbol to restore or highlight the main window box
    dockWelcome.addEventListener("click", function() {
      if (welcomeWindow.style.display === "none" || welcomeWindow.style.display === "") {
        // Run your centering initialization matrix parameters 
        welcomeWindow.style.top = "50%";
        welcomeWindow.style.left = "50%";
        welcomeWindow.style.transform = "translate(-50%, -50%)";
        welcomeWindow.style.display = "block";
      } else {
        // Shakes it slightly if it's already open to bring it to focus
        welcomeWindow.style.transform = "translate(-50%, -50%) scale(1.03)";
        setTimeout(() => {
          welcomeWindow.style.transform = "translate(-50%, -50%) scale(1)";
        }, 150);
      }
    });

  </script>
  
  <!-- Triggers your cursor window physics engine tracker -->
  <script src="script.js"></script>
 </body>
</html>
