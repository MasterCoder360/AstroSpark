<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AstroSpark WebOS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="startupScreen" class="startup-screen">
    <div class="startup-content">
      <img class="startup-logo-img" src="./AstroSparkIcon.png" alt="AstroSpark WebOS">
      <div class="boot-progress-container"><div id="bootProgressBar" class="boot-progress-bar"></div></div>
      <p id="bootStatusText" class="startup-subtitle">Initializing kernel modules...</p>
    </div>
  </div>

  <div class="top-bar">
    <p id="osTrigger" class="top-bar-title" title="Click to open Welcome window">AstroSparkOS</p>
    <p class="top-bar-badge">A Spark in Space</p>
    <p id="timeElement" class="top-bar-time"></p>
  </div>

  <!-- Windows are created on demand by script.js -->
  <div id="dock" class="dock-container"></div>
  <script src="script.js"></script>
</body>
</html>
