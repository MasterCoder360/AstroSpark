<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AstroSpark WebOS</title>
  <link rel="stylesheet" href="style.css">
  <!-- Loads the core VS Code Monaco editor engine library directly -->
  <script src="https://jsdelivr.net"></script>
</head>
<body>

  <!-- TOP BAR NAVIGATION -->
  <div class="top-bar">
    <p id="osTrigger" class="top-bar-title" title="Click to open Welcome window">AstroSparkOS</p>
    <p class="top-bar-badge">A Spark in Space</p>
    <p id="timeElement" class="top-bar-time"></p>
  </div>

  <!-- 1. WELCOME GLASS WINDOW BOX -->
  <div id="welcome" class="window-box">
    <div id="welcomeheader" class="closebutton">
      <div id="welcomeclose" title="Close">✕</div>
      <p class="window-header-title">AstroSpark</p>
      <div class="header-spacer"></div>
    </div>
    <h1>Welcome to AstroSpark WebOS!</h1>
    <h2>Introduction</h2>
    <p>Hello World</p>
    <img src="./BlackHole.jpeg" alt="Black Hole" />
  </div>

  <!-- 2. NEW VSCODE APPLICATIONS WINDOW (Hidden by default) -->
  <div id="vscodeWindow" class="window-box" style="display: none; width: 700px; height: 450px; padding: 10px;">
    <div id="vscodeWindowheader" class="closebutton">
      <div id="vscodeClose" title="Close">✕</div>
      <p class="window-header-title">Visual Studio Code</p>
      <div class="header-spacer"></div>
    </div>
    <!-- Monaco code canvas mount box -->
    <div id="monacoContainer" style="width: 100%; height: calc(100% - 35px); border-radius: 6px; overflow: hidden; border: 1px solid rgba(255,255,255,0.2);"></div>
  </div>

  <!-- LIQUID TASKBAR DOCK -->
  <div class="dock-container">
    <div id="dockWelcome" class="dock-icon active-app" title="Welcome App">✨</div>
    <div id="dockVSCode" class="dock-icon" title="VS Code App">🚀</div>
  </div>

  <!-- DESKTOP OPERATION SCRIPTS -->
  <script>
    // Live OS Clock
    function updateTime() {
        var currentTime = new Date().toLocaleString();
        var timeText = document.querySelector("#timeElement");
        if(timeText) timeText.innerHTML = currentTime;
    }
    setInterval(updateTime, 1000);
    updateTime(); 

    // Window Variables
    const welcomeWindow = document.getElementById("welcome");
    const vscodeWindow = document.getElementById("vscodeWindow");
    
    const closeWelcome = document.getElementById("welcomeclose");
    const closeVSCode = document.getElementById("vscodeClose");
    
    const osTrigger = document.getElementById("osTrigger");
    const dockWelcome = document.getElementById("dockWelcome");
    const dockVSCode = document.getElementById("dockVSCode");

    let editorInstance = null; // Holds our code text container instance

    // Initialize Monaco Code Frame Engine
    function initMonaco() {
      if (editorInstance) return; // Prevent double loads
      require.config({ paths: { vs: 'https://jsdelivr.net' } });
      require(['vs/editor/editor.main'], function () {
        editorInstance = monaco.editor.create(document.getElementById('monacoContainer'), {
          value: `// Welcome to AstroSpark Code Studio\nfunction initializeOS() {\n    console.log("AstroSparkOS running smoothly...");\n}`,
          language: 'javascript',
          theme: 'vs-dark',
          automaticLayout: true
        });
      });
    }

    // Window Swapping Logic: Launch VS Code App and HIDE Welcome
    dockVSCode.addEventListener("click", function() {
      welcomeWindow.style.display = "none";
      dockWelcome.classList.remove("active-app");
      
      // Open and Center VS Code
      vscodeWindow.style.top = "50%";
      vscodeWindow.style.left = "50%";
      vscodeWindow.style.transform = "translate(-50%, -50%)";
      vscodeWindow.style.display = "block";
      dockVSCode.classList.add("active-app");
      
      // Fire up editor canvas runtime
      initMonaco();
    });

    // Bring Back Welcome and Hide VS Code
    dockWelcome.addEventListener("click", function() {
      vscodeWindow.style.display = "none";
      dockVSCode.classList.remove("active-app");
      
      welcomeWindow.style.top = "50%";
      welcomeWindow.style.left = "50%";
      welcomeWindow.style.transform = "translate(-50%, -50%)";
      welcomeWindow.style.display = "block";
      dockWelcome.classList.add("active-app");
    });

    // Close Actions
    closeWelcome.addEventListener("click", function(e) {
      e.stopPropagation();
      welcomeWindow.style.display = "none";
      dockWelcome.classList.remove("active-app");
    });

    closeVSCode.addEventListener("click", function(e) {
      e.stopPropagation();
      vscodeWindow.style.display = "none";
      dockVSCode.classList.remove("active-app");
    });

    // Header click safety fallback restore
    osTrigger.addEventListener("click", () => dockWelcome.click());
  </script>
  
  <script src="script.js"></script>
 </body>
</html>
