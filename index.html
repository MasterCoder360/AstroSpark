<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AstroSpark WebOS</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="startupScreen" class="startup-screen">
    <div class="startup-content">
      <img class="startup-logo-img" src="./AstroSparkIcon.png" alt="AstroSpark WebOS">
      <div class="boot-progress-container">
        <div id="bootProgressBar" class="boot-progress-bar"></div>
      </div>
      <p id="bootStatusText" class="startup-subtitle">Starting AstroSpark...</p>
    </div>
  </div>

  <div class="top-bar">
    <p id="osTrigger" class="top-bar-title" title="Who am I">AstroSparkOS</p>
    <p class="top-bar-badge">A Spark in Space</p>
    <p id="timeElement" class="top-bar-time"></p>
  </div>

  <div id="dock" class="dock-container"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="script.js"></script>
</body>
</html>
